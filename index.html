<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Library</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Library Tracker</h1>
    <button id="add-book-btn">+ Add Book</button>
  </header>

  <main>
    <div class="library-grid" id="library-grid">
    </div>
  </main>

  <dialog id="book-dialog">
    <form id="book-form" method="dialog">
      <h2>Add a New Book</h2>
      
      <div class="input-group">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" required>
      </div>

      <div class="input-group">
        <label for="author">Author</label>
        <input type="text" id="author" name="author" required>
      </div>

      <div class="input-group">
        <label for="pages">Pages</label>
        <input type="number" id="pages" name="pages" required>
      </div>

      <div>
        <select id="read" name="read">
          <option value="complete">Complete</option>
          <option value="pending">Pending</option>
          <option value="not readed">Not readed</option>
        </select>
        <!-- <input type="checkbox"  name="read">
        <label for="read">I have read this book</label> -->
      </div>

      <div class="form-actions">
        <button type="button" id="cancel-btn">Cancel</button>
        <button type="submit" id="submit-btn">Save Book</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
